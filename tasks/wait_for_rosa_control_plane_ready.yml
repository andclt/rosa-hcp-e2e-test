- name: Wait for ROSA Control Plane status to be ready
  shell: oc get rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace | default('ns-rosa-hcp') }} -o json | jq -r '.status.ready'
  register: rcp_status
  until: rcp_status.stdout | bool
  retries: "{{ 75 if retry_count is undefined else retry_count|int }}"
  delay: "{{ 30 if delay is undefined else delay|int }}"
  ignore_errors: true

- name: Get ROSA Control Plane status on failure
  shell: >
    oc get rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace | default('ns-rosa-hcp') }}
    -o json | jq -r '(.status.conditions // [])[] | "\(.type): \(.status) - \(.message // .reason // "n/a")"'
  register: rcp_conditions
  ignore_errors: true
  when: not (rcp_status.stdout | bool)

- name: Fail if ROSA Control Plane did not become ready
  fail:
    msg: |
      ROSA HCP cluster did not become ready within the timeout period.

      Control Plane conditions:
      {{ rcp_conditions.stdout | default('Unable to fetch conditions', true) }}

      For full details:
      oc describe rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace | default('ns-rosa-hcp') }}
  when: not (rcp_status.stdout | bool)

- name: Print the ROSA control plane is ready
  debug:
    msg: |
      ROSA HCP Control Plane is READY!

      Cluster: {{ cluster_name }}
      Namespace: {{ rosa_hcp_namespace | default('ns-rosa-hcp') }}
      Status: Running and available
  when: rcp_status.stdout | bool
